<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama BPMN - [NOMBRE DEL PROCESO]</title>
    <link rel="stylesheet" href="https://unpkg.com/bpmn-js@17.0.2/dist/assets/diagram-js.css">
    <link rel="stylesheet" href="https://unpkg.com/bpmn-js@17.0.2/dist/assets/bpmn-js.css">
    <link rel="stylesheet" href="https://unpkg.com/bpmn-js@17.0.2/dist/assets/bpmn-font/css/bpmn-embedded.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; }
        .wrapper { max-width: 1400px; margin: auto; padding: 24px; }
        
        .top-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; font-size: 0.88em; }
        .top-nav a { text-decoration: none; color: #27ae60; font-weight: 600; padding: 6px 14px; border-radius: 6px; background: #ecf9f1; }
        .top-nav a:hover { background: #d0eddf; }
        .top-nav .sep { color: #aaa; }
        .top-nav .current { color: #2c3e50; font-weight: 600; }

        h1 { color: #2c3e50; border-bottom: 3px solid #27ae60; padding-bottom: 10px; margin-bottom: 6px; font-size: 1.6em; }
        .subtitle { color: #555; margin-bottom: 18px; font-size: 0.95em; }

        .bpmn-wrapper {
            background: #fff; padding: 0; border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.10); margin: 18px 0 28px;
            height: 600px; position: relative;
        }
        #canvas { width: 100%; height: 100%; }
        .controls {
            position: absolute; top: 10px; right: 10px; z-index: 10;
            background: white; padding: 8px; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); display: flex; gap: 8px;
        }
        .controls button {
            padding: 6px 12px; border: 1px solid #ddd; background: white;
            border-radius: 6px; cursor: pointer; font-size: 0.85em;
        }
        .controls button:hover { background: #f8f9fa; border-color: #27ae60; }

        h2 { color: #2c3e50; border-bottom: 2px solid #27ae60; padding-bottom: 8px; margin-top: 32px; margin-bottom: 14px; font-size: 1.25em; }
        table.desc { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        table.desc th, table.desc td { border: 1px solid #dde; padding: 11px 14px; text-align: left; font-size: 0.93em; }
        table.desc th { background: #27ae60; color: #fff; font-weight: 600; }
        table.desc tr:nth-child(even) { background: #f8faf9; }
        table.desc tr:hover { background: #e8f6ef; }
    </style>
</head>
<body>
<div class="wrapper">

<!-- Navigation -->
<nav class="top-nav">
    <a href="index.html">&#9664; Inicio</a>
    <span class="sep">/</span>
    <span class="current">[NOMBRE DEL PROCESO]</span>
</nav>

<h1>[TÍTULO DEL PROCESO]</h1>
<p class="subtitle">[DESCRIPCIÓN DEL PROCESO]</p>

<!-- BPMN Diagram -->
<div class="bpmn-wrapper">
    <div class="controls">
        <button onclick="zoomIn()">🔍 +</button>
        <button onclick="zoomOut()">🔍 −</button>
        <button onclick="resetZoom()">⟲ Reset</button>
        <button onclick="exportSVG()">⬇ SVG</button>
    </div>
    <div id="canvas"></div>
</div>

<!-- Description Table -->
<h2>Descripción Detallada de Actividades</h2>
<table class="desc">
    <thead>
        <tr><th>#</th><th>Actividad</th><th>Responsable</th><th>Descripción</th></tr>
    </thead>
    <tbody>
        <!-- Agregar filas aquí -->
    </tbody>
</table>

</div>

<script src="https://unpkg.com/bpmn-js@17.0.2/dist/bpmn-navigated-viewer.development.js"></script>
<script>
let viewer;

async function initViewer() {
    viewer = new BpmnJS({ container: '#canvas', keyboard: { bindTo: document } });
    try {
        // CAMBIAR EL NOMBRE DEL ARCHIVO .bpmn AQUÍ
        const response = await fetch('[NOMBRE_ARCHIVO].bpmn');
        const xml = await response.text();
        await viewer.importXML(xml);
        viewer.get('canvas').zoom('fit-viewport');
    } catch (err) {
        console.error('Error:', err);
        alert('Error al cargar el diagrama BPMN');
    }
}

function zoomIn() { viewer.get('zoomScroll').stepZoom(1); }
function zoomOut() { viewer.get('zoomScroll').stepZoom(-1); }
function resetZoom() { viewer.get('canvas').zoom('fit-viewport'); }

async function exportSVG() {
    try {
        const { svg } = await viewer.saveSVG();
        const blob = new Blob([svg], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = '[NOMBRE_ARCHIVO].svg'; a.click();
        URL.revokeObjectURL(url);
    } catch (err) { alert('Error: ' + err.message); }
}

window.addEventListener('DOMContentLoaded', initViewer);
</script>
</body>
</html>
